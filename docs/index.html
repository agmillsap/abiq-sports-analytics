<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abigail Millsap | Product Portfolio</title>
<meta name="description" content="Interactive product case studies in decision intelligence, sales portfolio optimization, market opportunity, and ABIQ sports analytics.">
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#0a1930;background:#f4f7fb}
body{margin:0;min-height:100vh;display:grid;place-content:center;text-align:center}
section{max-width:420px;margin:24px;padding:36px;background:#fff;border:1px solid #dce5ef;border-radius:16px}
h1{font-size:24px;margin-bottom:10px}p{color:#62738a;line-height:1.5}.loading{font-size:14px;color:#163d75}.error{color:#ab2323}
</style>
</head>
<body>
<section id="loading"><h1>Abigail Millsap</h1><p>Product strategy · Decision intelligence · Interactive prototypes</p>
<p id="status" role="status" class="loading">Loading interactive portfolio…</p></section>
<script>
(async function(){
 try {
  if(!('fetch' in window)||!('Blob' in window))throw new Error('Your browser does not support this interactive portfolio.');
  const count=14;
  const paths=Array.from({length:count},(_,i)=>'./parts/'+String(i).padStart(2,'0')+'.part');
  const requests=paths.map(async (path)=>{
   const response=await fetch(path,{cache:'force-cache'});
   if(!response.ok)throw new Error('Unable to load portfolio content ('+response.status+').');
   return response.arrayBuffer();
  });
  const chunks=await Promise.all(requests);
  document.getElementById('status').textContent='Opening product dashboard…';
  const html=await new Blob(chunks,{type:'text/html;charset=utf-8'}).text();
  if(!html.toLowerCase().startsWith('<!doctype html>'))throw new Error('Portfolio content is incomplete.');
  // Preserve the user's original portfolio and demos; replace the external ABIQ app
  // with an always-available static local showcase in a portfolio-native overlay.
  // Update the two embedded enterprise-demo sidebars after their bundled
  // gzip payloads are expanded, preserving all other demos and original assets.
  const demoDecoder='async function getDemo(key){if(CACHE[key])return CACHE[key];CACHE[key]=await unpack(PACKED[key].data);return CACHE[key]}';
  const demoDecoderWithBranding=[
    'function stripSidebarBranding(key,source){',
    '  const css=key==="field"?".side .logoCrop #logo{visibility:hidden!important}":".sidebar .logo-wrap img{clip-path:inset(51px 0 0 0)!important}";',
    '  const page=key==="market"?source.replace("alt=\\\"Lowe\\\'s Pro Construction Insights\\\"","alt=\\\"Construction Insights\\\""):source;',
    '  return page.replace(/<\\/head>/i,\'<style id="portfolio-sidebar-branding">\'+css+\'</style></head>\');',
    '}',
    'async function getDemo(key){if(CACHE[key])return CACHE[key];CACHE[key]=stripSidebarBranding(key,await unpack(PACKED[key].data));return CACHE[key]}'
  ].join('\n');
  if(!html.includes(demoDecoder))throw new Error('Demo integration format has changed; the original dashboard was not modified.');
  const branded=html.replace(demoDecoder,demoDecoderWithBranding);
  const integrated=branded
    .replaceAll('https://abiq-sports.streamlit.app','./abiq/')
    .replace('>Open ABIQ</a>','>Open interactive demo</a>')
    .replace(/<\/head>/i,'<link rel="stylesheet" href="./abiq-embed.css"></head>')
    .replace(/<\/body>/i,'<scr'+'ipt src="./abiq-embed.js"></scr'+'ipt></body>');
  if(!integrated.includes('href="./abiq/"'))throw new Error('ABIQ showcase integration could not be confirmed.');
  document.open();
  document.write(integrated);
  document.close();
 }catch(error){
  const status=document.getElementById('status');
  if(status){status.className='error';status.textContent=error.message||'Unable to load the dashboard.';}
 }
})();
</script>
</body></html>
